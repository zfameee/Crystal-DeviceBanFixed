name: Build Crystal-DeviceBan

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Verify source tree
        shell: bash
        run: |
          test -f pom.xml
          test -f src/main/java/ru/crystaldeviceban/CrystalDeviceBanPlugin.java
          test -f src/main/resources/plugin.yml
          if grep -R --include='*.java' -nE 'class [A-Za-z0-9_]*-' src/main/java; then
            echo "ERROR: Java class name contains '-'"
            exit 1
          fi

      - name: Build with Maven
        run: mvn --batch-mode --errors --update-snapshots clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-DeviceBan-1.1.2
          path: target/*.jar
          if-no-files-found: error

